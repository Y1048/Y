name: MuJoCo all-joint inner limits
on:
  push:
    branches: [codex/g1-regular-handoff-20260910]
    paths:
      - 'experiments/twist2_right_arm_manual/joint_limit_guard.py'
      - 'experiments/twist2_right_arm_manual/mujoco_pd*.py'
      - 'experiments/twist2_right_arm_manual/test_joint_limit_guard.py'
      - 'experiments/twist2_right_arm_manual/test_mujoco_pd*.py'
      - '.github/workflows/mujoco-pd-joint-limits.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-joint-limits:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      G1_REQUIRE_MUJOCO: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install simulation-only dependencies
        run: python -m pip install -r experiments/twist2_right_arm_manual/mujoco_pd_requirements.txt
      - name: Existing and all-joint limit regressions including C++ parity
        working-directory: experiments/twist2_right_arm_manual
        run: >-
          python -B -m unittest -v test_mujoco_pd_sweep test_mujoco_pd_fixture
          test_mujoco_pd_artifacts test_mujoco_pd_expand test_mujoco_pd_motor_stress
          test_mujoco_pd_expand_audit test_joint_limit_guard test_mujoco_pd_limit_replay
