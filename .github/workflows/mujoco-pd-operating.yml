name: MuJoCo PD operating envelope
on:
  push:
    branches: [codex/g1-regular-handoff-20260910]
    paths:
      - 'experiments/twist2_right_arm_manual/mujoco_pd_operating*'
      - 'experiments/twist2_right_arm_manual/test_mujoco_pd_operating.py'
      - '.github/workflows/mujoco-pd-operating.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operating:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      G1_REQUIRE_MUJOCO: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated simulation-only dependencies
        run: python -m pip install -r experiments/twist2_right_arm_manual/mujoco_pd_requirements.txt
      - name: Offline allowlist, cross-engine parity, final-state limits and operating audit
        working-directory: experiments/twist2_right_arm_manual
        run: python -B -m unittest -v test_mujoco_pd_sweep test_mujoco_pd_fixture test_mujoco_pd_artifacts test_mujoco_pd_expand test_mujoco_pd_motor_stress test_mujoco_pd_expand_audit test_joint_limit_guard test_mujoco_pd_limit_replay test_mujoco_pd_robust_refine test_mujoco_pd_accuracy_stability test_mujoco_pd_minerror test_mujoco_pd_coupled_stress test_mujoco_pd_coupled_matrix test_mujoco_pd_operating
