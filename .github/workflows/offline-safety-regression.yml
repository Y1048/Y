name: Offline safety regressions

on:
  push:
    branches:
      - main
    paths:
      - 'hardware/g1_arm_bridge/**'
      - 'config/g1_*.json'
      - '.github/workflows/offline-safety-regression.yml'
  workflow_dispatch:

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install offline dependencies
        run: python -m pip install --disable-pip-version-check numpy mujoco

      - name: Shared and Gate 6 release
        run: |
          python hardware/g1_arm_bridge/test_arm_sdk_release_contract.py
          python hardware/g1_arm_bridge/test_gate6_fault_release.py
          python hardware/g1_arm_bridge/test_gate6_interrupt_release.py

      - name: Gate 7 release and acquisition
        run: |
          python hardware/g1_arm_bridge/test_gate7_release_finalization.py
          python hardware/g1_arm_bridge/test_gate7_live_safety_guard.py
          python hardware/g1_arm_bridge/test_gate7_acquisition_guard.py

      - name: Jog safety and result boundary
        run: |
          python hardware/g1_arm_bridge/test_right_arm_jog_safety_guard.py
          python hardware/g1_arm_bridge/test_g1_right_arm_jog_entry.py
