name: Reconcile review administration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/reconcile-review-admin.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild and verify review artifacts
        run: |
          python backend/tools/reconcile_review_ledger.py
          python backend/tools/build_code_index.py
          python backend/tools/reconcile_review_ledger.py --check
          python backend/tools/build_code_index.py --check
          cat logs/review/20260903/source_checks_summary_20260904.json
      - name: Commit regenerated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CODE_INDEX.md
          git add -f logs/review/20260903/source_checks.csv logs/review/20260903/source_checks_summary_20260904.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: reconcile backend support review coverage'
          git push origin HEAD:main
